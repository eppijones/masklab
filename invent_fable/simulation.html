<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEKLOMAT-1 — 3D Simulation</title>
<link rel="stylesheet" href="assets/sim.css">
</head>
<body>

<canvas id="sim-canvas"></canvas>

<header class="topbar">
  <span class="brand"><a href="index.html">HEKLOMAT-1</a> · SIMULATION</span>
  <select id="sel-pattern" aria-label="Pattern"></select>
  <div class="viewbtns">
    <button class="chip" data-view="overview" aria-pressed="true">Overview</button>
    <button class="chip" data-view="hook" aria-pressed="false">Hook</button>
    <button class="chip" data-view="top" aria-pressed="false">Top</button>
    <button class="chip" data-view="hat" aria-pressed="false">Hat</button>
  </div>
</header>

<aside class="hud">
  <h2 id="hud-title">—</h2>
  <p class="meta" id="hud-meta">—</p>
  <dl>
    <dt>Round</dt><dd id="hud-round">—</dd>
    <dt>Stitch</dt><dd id="hud-stitch">—</dd>
    <dt>Total</dt><dd id="hud-total">—</dd>
    <dt>Color chg</dt><dd id="hud-changes">—</dd>
    <dt>Section</dt><dd id="hud-phase">—</dd>
    <dt>Op</dt><dd id="hud-op" class="op">—</dd>
    <div class="divider"></div>
    <dt>Elapsed</dt><dd id="hud-clock">0:00</dd>
    <dt>Remaining</dt><dd id="hud-eta">—</dd>
    <dt>Full hat @1×</dt><dd id="hud-machine-time">—</dd>
    <dt>By hand</dt><dd id="hud-hand-time">—</dd>
  </dl>
</aside>

<div class="controls">
  <button class="chip" data-speed="1" aria-pressed="false">1×</button>
  <button class="chip" data-speed="10" aria-pressed="false">10×</button>
  <button class="chip" data-speed="60" aria-pressed="false">60×</button>
  <button class="chip" data-speed="600" aria-pressed="false">600×</button>
  <button class="chip" data-speed="end">To the end</button>
  <button class="chip" id="btn-pause" aria-pressed="false">⏸</button>
  <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub">
  <span class="clock" id="ctl-note"></span>
</div>

<div class="progress"><div id="progress-fill"></div></div>

<div id="banner" role="dialog" aria-live="polite">
  <p id="banner-text"></p>
  <button id="btn-restart">Start again</button>
</div>

<script src="vendor/three.js"></script>
<script src="data/patterns.js"></script>
<script src="js/hatmath.js"></script>
<script src="js/opcode.js"></script>
<script src="js/simclock.js"></script>
<script src="js/machine.js"></script>
<script src="js/hatgrowth.js"></script>
<script src="js/sim-main.js"></script>
</body>
</html>
