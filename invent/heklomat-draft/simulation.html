<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HEKLOMAT-1 — machine previs</title>
  <link rel="stylesheet" href="assets/sim.css?v=4" />
</head>
<body>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="hud">
    <div class="top">
      <a class="brand" href="index.html">HEKLOMAT-1</a>
      <select id="pattern" aria-label="Pattern"></select>
      <div class="op" id="op">MR</div>
      <div class="stat" id="round">Round <span>—</span></div>
      <div class="stat" id="stitch">Stitch <span>—</span></div>
      <div class="stat" id="total">Total <span>—</span></div>
      <div class="stat" id="cols">Color changes <span>—</span></div>
    </div>
    <div id="banner" class="banner">
      <h2 id="bannerTitle">FINISHED</h2>
      <p id="bannerBody"></p>
      <button type="button" id="restart">Restart</button>
    </div>
    <div class="bottom">
      <div class="controls" id="speeds">
        <button type="button" data-speed="1" class="active">1×</button>
        <button type="button" data-speed="10">10×</button>
        <button type="button" data-speed="60">60×</button>
        <button type="button" data-speed="600">600×</button>
        <button type="button" id="end">To the end</button>
        <button type="button" id="pause" aria-pressed="false">Pause</button>
      </div>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub simulation" />
      <div class="stat" id="clock">Elapsed <span>0 s</span></div>
      <div class="stat" id="eta">ETA at 1× <span>—</span></div>
      <div class="controls" id="views">
        <button type="button" data-view="overview" class="active">Overview</button>
        <button type="button" data-view="hook">Hook</button>
        <button type="button" data-view="top">Top</button>
        <button type="button" data-view="hat">Hat</button>
      </div>
    </div>
  </div>
  <div id="err" class="err" hidden></div>
  <script src="vendor/three.js"></script>
  <script src="data/patterns.js"></script>
  <script src="js/hatmath.js?v=4"></script>
  <script src="js/opcode.js"></script>
  <script src="js/simclock.js"></script>
  <script src="js/machine.js?v=4"></script>
  <script src="js/hatgrowth.js?v=4"></script>
  <script src="js/sim-main.js?v=4"></script>
</body>
</html>
